# Single compose file for the server: postgres + backend + frontend.
#
# From repo root on EC2:
#   docker compose --env-file ./backend/.env up -d --build
#
# Backend talks to Postgres via Docker DNS: postgres:5432
# Host tools (Prisma on the VM) can use localhost:5433

services:
  postgres:
    image: postgres:16
    container_name: 3m-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-3m}
      POSTGRES_USER: ${POSTGRES_USER:-3m_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - 3m_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: 3m-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override .env localhost URL — inside Docker use service name
      DATABASE_URL: postgresql://${POSTGRES_USER:-3m_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-3m}?schema=public
      PORT: ${PORT:-4000}
      NODE_ENV: production
    # Host port must match PORT inside the container (nginx proxies 3m-api to it)
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./fe
      # NEXT_PUBLIC_* are baked into the browser bundle at build time, so they
      # must be public URLs — 127.0.0.1 would point at the visitor's own machine.
      args:
        NEXT_PUBLIC_AUTH_SERVER_URL: ${NEXT_PUBLIC_AUTH_SERVER_URL:-https://3m-api.chatsguru.co/api/v1}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    container_name: 3m-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      - backend

volumes:
  3m_postgres_data:
    name: 3m_postgres_data
